[package]
name = "openphoto-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
openphoto-geom = { workspace = true }
openphoto-color = { workspace = true }
openphoto-raster = { workspace = true }
openphoto-doc = { workspace = true }
openphoto-compose = { workspace = true }
openphoto-gpu = { workspace = true }
openphoto-engine = { workspace = true }
openphoto-plugins = { workspace = true }
openphoto-algo = { workspace = true }
openphoto-text = { workspace = true }
openphoto-vector = { workspace = true }
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# Render types used directly (the GPU canvas and `set_wgpu`): the same crates eframe re-exports,
# so the desktop `cc.wgpu_render_state` and the HarmonyOS host pass the identical type.
egui-wgpu = "0.36"
wgpu = "30"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = "0.22"

# eframe is the desktop/wasm shell only: the editor logic and UI in this crate are platform-free
# and shared with the HarmonyOS host (`apps/openphoto-ohos`), which drives them without eframe.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Only for examples/snapshot.rs (offscreen UI renders of real files).
openphoto-io = { workspace = true }
# Only for examples/interactive_bench.rs (JPEG encode, .pcraft saves).
openphoto-codecs = { workspace = true }
openphoto-format = { workspace = true }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
openphoto-testkit = { workspace = true }

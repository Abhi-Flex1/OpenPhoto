[package]
name = "openphoto-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
openphoto-geom = { workspace = true }
openphoto-color = { workspace = true }
openphoto-cms = { workspace = true }
openphoto-raster = { workspace = true }
openphoto-doc = { workspace = true }
openphoto-ops = { workspace = true }
openphoto-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
openphoto-paint = { workspace = true }
openphoto-algo = { workspace = true }
openphoto-text = { workspace = true }
openphoto-vector = { workspace = true }
openphoto-io = { workspace = true }
openphoto-psd = { workspace = true }
openphoto-format = { workspace = true }
openphoto-plugins = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
openphoto-codecs = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
# Synthetic camera raw files for the open tests.
openphoto-raw = { workspace = true, features = ["testgen"] }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
